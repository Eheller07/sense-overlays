<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色彩漫游</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#222c2e;color:#f5f0e6;font:16px "Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:23px;margin:0;font-weight:500}small{font-size:11px;letter-spacing:2px;color:#d1ad6e}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}button{cursor:pointer;border:1px solid #414c4c;background:transparent;color:inherit;text-align:left;padding:0}button.active{border:2px solid #d1ad6e}img{width:100%;height:150px;object-fit:cover;display:block}.caption{padding:13px;font-size:14px}footer{display:flex;align-items:center;gap:14px;margin-top:20px;padding-top:16px;border-top:1px solid #414c4c}.dot{width:12px;height:12px;border-radius:50%;background:#d1ad6e}#story{font-size:14px;margin:0;color:#d1ad6e}@media(max-width:600px){body{padding:15px}.cards{gap:10px}img{height:110px}.caption{font-size:12px;padding:8px}h1{font-size:19px}}</style>
<header><h1>选一处风景，留下此刻心情。</h1><small>COLOR / JOURNEY</small></header><main class="cards">
<button class="active" data-text="晴日 · 在明亮的黄色里，感受轻盈。" data-color="#d1ad6e"><img src="landscape-1.jpg" alt="黄色花海"><div class="caption">01 / 晴日</div></button>
<button data-text="暮色 · 跟随夕阳，让心慢下来。" data-color="#eaa677"><img src="landscape-2.jpg" alt="夕阳与河流"><div class="caption">02 / 暮色</div></button>
<button data-text="深蓝 · 听海，等待城市的灯亮起来。" data-color="#8cb7db"><img src="landscape-3.jpg" alt="蓝色海岸"><div class="caption">03 / 深蓝</div></button></main>
<footer><span class="dot"></span><p id="story" aria-live="polite">晴日 · 在明亮的黄色里，感受轻盈。</p></footer><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(a=>a.classList.remove('active'));b.classList.add('active');document.getElementById('story').textContent=b.dataset.text;document.getElementById('story').style.color=b.dataset.color;document.querySelector('.dot').style.background=b.dataset.color;});</script></html>
